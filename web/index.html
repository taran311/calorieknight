<!DOCTYPE html>
<html>
<head>
  <!-- Replaced by `flutter build web --base-href /` (the site is served from calorieknight.com/). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CalorieKnight: a medieval adventure where every meal you log is a strike against your foe.">
  <meta name="theme-color" content="#14110D">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CalorieKnight">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CalorieKnight</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* The camp's dark stone while the app loads (no white flash). */
    html, body { margin: 0; height: 100%; background: #14110D; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #E3A548; font: 600 18px Georgia, serif; letter-spacing: .08em; }
  </style>
</head>
<body>
  <div id="loading">Sharpening your blade…</div>
  <script>
    // Flutter's first frame replaces the loading text.
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loading');
      if (l) l.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
