name: calorieknight
description: CalorieKnight - a medieval RPG where logging food is how you fight.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  http: ^1.2.0
  google_fonts: ^6.2.0
  crypto: ^3.0.3
  # Sign-in, in The Calorie Card's Firebase project (same versions as The Calorie Card).
  firebase_core: ^3.4.1
  firebase_auth: ^5.2.1
  cloud_firestore: ^5.4.1
  # The Calorie Card's contactless logging: barcode scanning and meal photos.
  mobile_scanner: ^7.4.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
